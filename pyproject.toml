[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superonn"
version = "0.5.2"
description = "Polynomial convolution layers with fixed or learned receptive fields for PyTorch and TensorFlow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
keywords = ["superonn", "selfonn", "pytorch", "tensorflow", "convolution", "neural-networks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Source = "https://github.com/Sakib1263/SuperONN-Layers"
Documentation = "https://github.com/Sakib1263/SuperONN-Layers/blob/main/README.md"
Issues = "https://github.com/Sakib1263/SuperONN-Layers/issues"

[project.optional-dependencies]
torch = ["torch>=2.6,<3"]
tensorflow = ["tensorflow==2.21.0", "keras>=3.15,<4"]
test = ["numpy>=1.26,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["superonn", "superonn.*"]
