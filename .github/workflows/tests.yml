name: SuperONN tests
on: [push, pull_request]
permissions:
  contents: read
env:
  CUDA_VISIBLE_DEVICES: '-1'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
jobs:
  torch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        torch: ['2.6.0', '2.14.1']
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[test]'
      - run: pytest tests/test_public_api.py -q
  tensorflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[test,tensorflow]' keras==3.15.1
      - run: pytest tests/test_tensorflow_api.py -q
