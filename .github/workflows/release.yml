name: Release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  CUDA_VISIBLE_DEVICES: '-1'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install --no-deps dist/*.whl
      - name: Check framework-free installed metadata
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import sys
          import superonn
          from superonn.options import SUPERONN_DEFAULTS
          assert metadata.version('superonn') == superonn.__version__
          assert SUPERONN_DEFAULTS['q'] == 3
          assert 'torch' not in sys.modules and 'tensorflow' not in sys.modules
          assert metadata.metadata('superonn')['License-Expression'] == 'MIT'
          PY
  torch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        torch: ['2.6.0', '2.14.1']
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[test]'
      - name: CPU PyTorch regression gate
        run: python -B -m tests.run_checks torch
      - name: Check installed PyTorch API
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import sys
          import torch
          from superonn.pytorch import SuperONN1d, SuperONN2d, SuperONNTranspose1d, SuperONNTranspose2d
          for cls in (SuperONN1d, SuperONN2d, SuperONNTranspose1d, SuperONNTranspose2d):
              layer = cls(2, 4, 3, padding=1, device='meta')
              layer.to_empty(device='cpu')
              layer.reset_parameters()
              assert torch.isfinite(layer(torch.zeros(1, 2, *((4,) * cls.spatial_rank)))).all()
          assert 'tensorflow' not in sys.modules
          PY
  tensorflow:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install '.[tensorflow,test]' keras==3.15.1
      - name: CPU TensorFlow regression gate
        run: python -B -m unittest -v tests.test_base tests.test_tensorflow
      - name: Check installed TensorFlow API
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import sys
          import tensorflow as tf
          from superonn.tensorflow import SuperONN1D, SuperONN2D, SuperONNTranspose1D, SuperONNTranspose2D
          for cls, rank in ((SuperONN1D, 1), (SuperONN2D, 2), (SuperONNTranspose1D, 1), (SuperONNTranspose2D, 2)):
              layer = cls(4, 3, padding=1)
              assert tf.reduce_all(tf.math.is_finite(layer(tf.zeros((1, *((4,) * rank), 2)))))
          assert 'torch' not in sys.modules
          PY
